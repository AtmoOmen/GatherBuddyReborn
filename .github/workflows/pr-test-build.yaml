name: Pull Request Test Build
on:
  pull_request:
    branches:
      - main
jobs:
  Build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          # The merged upstream sources use C# 15; the plugin still targets .NET 10.
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Install verified mainland Dalamud references
        shell: pwsh
        run: ./scripts/install-dalamud-cn.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'gbr-dalamud-cn')

      - name: Initialize RebornMaterial source for the mainland build
        shell: pwsh
        run: ./scripts/Initialize-CnRebornMaterial.ps1

      - name: Restore Nuget Packages
        run: dotnet restore Gatherbuddy/Gatherbuddy.csproj

      - name: Build Plugin
        run: dotnet build --no-restore -c Release Gatherbuddy/Gatherbuddy.csproj --output .\build
      - name: Verify compiled mainland references
        shell: pwsh
        run: ./scripts/verify-dalamud-cn.ps1 -OutputDirectory build

      - name: Build raphael-cli from raphael-rs
        run: |
          git clone https://github.com/KonaeAkira/raphael-rs.git raphael-rs-temp
          cd raphael-rs-temp
          cargo build --release --package raphael-cli
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Error: Failed to build raphael-cli"
            exit 1
          }
          Copy-Item -Path ".\target\release\raphael-cli.exe" -Destination "..\build\raphael-cli.exe" -Force
          cd ..
          Remove-Item -Recurse -Force raphael-rs-temp
          Write-Host "Successfully built and copied raphael-cli.exe"
